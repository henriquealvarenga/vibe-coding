        text: "Keynote"
        href: apresentacao/aula-vibe-coding.qmd
        target: "_blank"
      - icon: search

  page-footer:
    background: dark
    border: false
    left: |
      Desenvolvido por [Henrique Alvarenga da Silva](https://henriquealvarenga.com) © 2026
    right: |
      [Créditos](/creditos.qmd)

