website:
  title: "Vibe Coding na Pesquisa Científica"
  site-url: https://henriquealvarenga.com/vibe-coding
  favicon: images/house-fill.svg
  description: |
    Curso de Vibe Coding aplicado à pesquisa médica: agentes de IA,
    análise de dados em R e Python, escrita técnica em Quarto e
    publicação científica reprodutível.
  open-graph: true
  twitter-card: true

  search:
    location: navbar
    type: overlay

  navbar:
    background: dark
    logo: images/house-fill.svg
    logo-alt: "Início"
    left:
